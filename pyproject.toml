[project]
name = "gh-migration-tool"
version = "0.1.13"
description = "Extensible Python SDK and CLI for orchestrating 7-stage SCM-to-GitHub repository migrations"
authors = [
    { name = "ilegra" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.4",
    "pyjwt[crypto]>=2.8.0",
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "gh-repo-sync @ git+https://github.com/ilegra/gh-repo-sync.git@v1.1.17",
    "gh-migration-inventory-manager @ git+https://github.com/ilegra/gh-migration-inventory-manager.git@v1.3.21",
]

[project.scripts]
gh-migration-tool = "gh_migration_tool.cli:main"

[tool.poetry]
packages = [{ include = "gh_migration_tool", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-mock = "^3.12.0"
responses = ">=0.25,<0.27"
ruff = ">=0.17.6"
mypy = ">=1.13.0"
bandit = "^1.7.10"
pre-commit = "^4.0.0"
types-PyYAML = "^6.0.12"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gh_repo_sync.*",
    "src.config",
    "src.core.*",
    "src.git.*",
    "src.providers.*",
    "gh_migration_inventory_manager.*",
    "responses.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
